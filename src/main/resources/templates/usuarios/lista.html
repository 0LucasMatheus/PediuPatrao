<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuários</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-people-fill me-2 text-primary"></i>Usuários
        </h2>
        <a href="/usuarios/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Usuário
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <form id="filtros" th:action="@{/usuarios}" method="get" class="card card-body shadow-sm mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label small">Username</label>
                <input type="text" name="username" class="form-control form-control-sm"
                       th:value="${username}" placeholder="Ex: joao">
            </div>
            <div class="col-md-3">
                <label class="form-label small">Perfil</label>
                <select name="perfil" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option value="ADMIN" th:selected="${perfil == 'ADMIN'}">ADMIN</option>
                    <option value="GERENTE" th:selected="${perfil == 'GERENTE'}">GERENTE</option>
                    <option value="ATENDENTE" th:selected="${perfil == 'ATENDENTE'}">ATENDENTE</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">Ordenar por</label>
                <select name="ordem" class="form-select form-select-sm">
                    <option value="username" th:selected="${ordem == 'username'}">Username A-Z</option>
                    <option value="username_desc" th:selected="${ordem == 'username_desc'}">Username Z-A</option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-1">
                <button type="submit" class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-search"></i> Filtrar
                </button>
                <a th:href="@{/usuarios}" class="btn btn-sm btn-outline-secondary" title="Limpar">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>
        </div>
    </form>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-4">#</th>
                        <th scope="col">Username</th>
                        <th scope="col">Role</th>
                        <th scope="col" class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${usuarios.empty}">
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum usuário cadastrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="usuario, stat : ${usuarios.content}">
                        <!-- numero continua contando nas outras paginas -->
                        <td class="ps-4 text-muted" th:text="${usuarios.number * usuarios.size + stat.index + 1}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="avatar-circle">
                                    <span th:text="${#strings.toUpperCase(#strings.substring(usuario.username, 0, 1))}"></span>
                                </div>
                                <span class="fw-medium" th:text="${usuario.username}"></span>
                            </div>
                        </td>
                        <td>
                            <!-- mesma cor do perfil la na sidebar -->
                            <span class="badge bg-danger" th:if="${usuario.role?.name() == 'ADMIN'}">ADMIN</span>
                            <span class="badge bg-warning text-dark" th:if="${usuario.role?.name() == 'GERENTE'}">GERENTE</span>
                            <span class="badge bg-info text-dark" th:if="${usuario.role?.name() == 'ATENDENTE'}">ATENDENTE</span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </a>
                            <!-- n mostra excluir na propria linha -->
                            <form th:if="${usuario.username != #authentication.name}"
                                  th:action="@{/usuarios/deletar/{id}(id=${usuario.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Deseja realmente excluir este usuário?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash-fill"></i> Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <div class="small text-muted mb-2">
                Total: <strong th:text="${usuarios.totalElements}"></strong> usuário(s)
            </div>
            <div th:replace="~{fragments/paginacao :: paginacao(${usuarios})}"></div>
        </div>
    </div>

    <style>
        .avatar-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: #0d6efd22;
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
    </style>

</div>

</body>
</html>
