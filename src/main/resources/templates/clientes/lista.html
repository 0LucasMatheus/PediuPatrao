<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a th:href="@{/clientes/novo}" class="btn btn-primary" sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Mensagens de alertas -->
    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <form id="filtros" th:action="@{/clientes}" method="get" class="card card-body shadow-sm mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label small">Buscar</label>
                <input type="text" name="busca" class="form-control form-control-sm"
                       th:value="${busca}" placeholder="Nome ou telefone">
            </div>
            <div class="col-md-4">
                <label class="form-label small">Ordenar por</label>
                <select name="ordem" class="form-select form-select-sm">
                    <option value="nome" th:selected="${ordem == 'nome'}">Nome A-Z</option>
                    <option value="nome_desc" th:selected="${ordem == 'nome_desc'}">Nome Z-A</option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-1">
                <button type="submit" class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-search"></i> Filtrar
                </button>
                <a th:href="@{/clientes}" class="btn btn-sm btn-outline-secondary" title="Limpar">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>
        </div>
    </form>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${clientes.empty}">
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente encontrado.
                        </td>
                    </tr>
                    <tr th:each="cliente : ${clientes.content}">
                        <td class="ps-4 fw-medium" th:text="${cliente.nome} ?: '—'"></td>
                        <td th:text="${cliente.telefone} ?: '—'"></td>
                        <td>
                            <span th:text="${cliente.logradouro}"></span>,
                            <span th:text="${cliente.numero}"></span> -
                            <span th:text="${cliente.bairro}"></span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                               class="btn btn-sm btn-outline-primary me-1"
                               sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </a>
                            <form th:action="@{/clientes/excluir/{id}(id=${cliente.id})}"
                                  method="post" class="d-inline"
                                  sec:authorize="hasRole('GERENTE')"
                                  onsubmit="return confirm('Tem certeza que deseja excluir este cliente?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash-fill"></i> Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <div class="small text-muted mb-2">
                Total: <strong th:text="${clientes.totalElements}"></strong> cliente(s)
            </div>
            <div th:replace="~{fragments/paginacao :: paginacao(${clientes})}"></div>
        </div>
    </div>
</div>
</body>
</html>
