<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
    </div>

    <form id="filtros" th:action="@{/auditoria}" method="get" class="card card-body shadow-sm mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small">Usuário</label>
                <input type="text" name="usuario" class="form-control form-control-sm"
                       th:value="${usuario}" placeholder="Ex: atendente">
            </div>
            <div class="col-md-2">
                <label class="form-label small">Entidade</label>
                <select name="entidade" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    <option value="clientes" th:selected="${entidade == 'clientes'}">Clientes</option>
                    <option value="pedidos" th:selected="${entidade == 'pedidos'}">Pedidos</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small">Ação</label>
                <select name="acao" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    <option value="INCLUSAO" th:selected="${acao == 'INCLUSAO'}">Inclusão</option>
                    <option value="ALTERACAO" th:selected="${acao == 'ALTERACAO'}">Alteração</option>
                    <option value="EXCLUSAO" th:selected="${acao == 'EXCLUSAO'}">Exclusão</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small">Campo alterado</label>
                <input type="text" name="campo" class="form-control form-control-sm"
                       th:value="${campo}" placeholder="Ex: status">
            </div>
            <div class="col-md-2">
                <label class="form-label small">Ordenar por</label>
                <select name="ordem" class="form-select form-select-sm">
                    <option value="recentes" th:selected="${ordem == 'recentes'}">Mais recentes</option>
                    <option value="antigos" th:selected="${ordem == 'antigos'}">Mais antigos</option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-1">
                <button type="submit" class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-search"></i> Filtrar
                </button>
                <a th:href="@{/auditoria}" class="btn btn-sm btn-outline-secondary" title="Limpar">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data e hora</th>
                        <th>Usuário</th>
                        <th>Ação</th>
                        <th>Entidade</th>
                        <th>Alterações</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${registros.empty}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum registro encontrado.
                        </td>
                    </tr>
                    <tr th:each="registro : ${registros.content}">
                        <td class="ps-4 text-nowrap" th:text="${#temporals.format(registro.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <div class="fw-medium" th:text="${registro.usuario}"></div>
                            <span class="badge bg-secondary" th:text="${registro.perfil}"></span>
                        </td>
                        <td>
                            <span class="badge bg-success" th:if="${registro.acao?.name() == 'INCLUSAO'}">INCLUSÃO</span>
                            <span class="badge bg-primary" th:if="${registro.acao?.name() == 'ALTERACAO'}">ALTERAÇÃO</span>
                            <span class="badge bg-danger" th:if="${registro.acao?.name() == 'EXCLUSAO'}">EXCLUSÃO</span>
                        </td>
                        <td>
                            <div th:text="${registro.entidade}"></div>
                            <small class="text-muted" th:text="${registro.entidadeId}"></small>
                        </td>
                        <td class="small">
                            <!-- campo: antes -> depois -->
                            <div th:each="alteracao : ${registro.alteracoes}">
                                <strong th:text="${alteracao.campo}"></strong>:
                                <span class="text-danger" th:text="${alteracao.valorAnterior} ?: '—'"></span>
                                <i class="bi bi-arrow-right"></i>
                                <span class="text-success" th:text="${alteracao.valorNovo} ?: '—'"></span>
                            </div>
                        </td>
                        <td class="small" th:text="${registro.justificativa} ?: '—'"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <div class="small text-muted mb-2">
                Total: <strong th:text="${registros.totalElements}"></strong> registro(s)
            </div>
            <div th:replace="~{fragments/paginacao :: paginacao(${registros})}"></div>
        </div>
    </div>

</div>

</body>
</html>
