<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <form th:action="@{/pedidos/salvar}" method="post" class="card shadow-sm" style="max-width: 800px;">
        <div class="card-body p-4">

            <!-- Cliente -->
            <div class="mb-4 position-relative">
                <label for="buscaCliente" class="form-label fw-medium">
                    <i class="bi bi-person me-1"></i>Cliente
                </label>
                <input type="text" id="buscaCliente" class="form-control"
                       placeholder="Digite o nome do cliente" autocomplete="off">

                <!-- aparece no lugar do campo depois de escolher -->
                <div id="clienteEscolhido" class="form-control"
                     style="display: none; justify-content: space-between; align-items: center;">
                    <span id="nomeClienteEscolhido" class="fw-medium"></span>
                    <button type="button" id="trocarCliente" class="btn-close" title="Trocar cliente"></button>
                </div>

                <!-- o id do cliente escolhido vai aqui -->
                <input type="hidden" id="clienteId" name="clienteId">
                <div id="resultadosCliente" class="list-group position-absolute w-100 shadow" style="z-index: 11;"></div>
            </div>

            <!-- Busca de produto -->
            <div class="mb-3 position-relative">
                <label for="buscaProduto" class="form-label fw-medium">
                    <i class="bi bi-search me-1"></i>Adicionar item
                </label>
                <input type="text" id="buscaProduto" class="form-control"
                       placeholder="Digite o nome do produto" autocomplete="off">
                <!-- resultados da busca aparecem aqui -->
                <div id="resultados" class="list-group position-absolute w-100 shadow" style="z-index: 10;"></div>
            </div>

            <!-- Itens do pedido -->
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th style="width: 110px;">Qtd</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="itens">
                    <tr id="semItens">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum item adicionado.</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="3" class="text-end">Total</th>
                        <!-- so visual, o servidor que calcula o valor de verdade -->
                        <th id="total" colspan="2">R$ 0,00</th>
                    </tr>
                </tfoot>
            </table>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Registrar Pedido
                </button>
                <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
            </div>

        </div>
    </form>

    <script>
        const buscaProduto = document.getElementById('buscaProduto');
        const resultados = document.getElementById('resultados');
        const tabelaItens = document.getElementById('itens');
        const semItens = document.getElementById('semItens');

        // 4990 vira R$ 49,90
        function formatarCentavos(centavos) {
            return 'R$ ' + (centavos / 100).toFixed(2).replace('.', ',');
        }

        // ===== busca de cliente =====
        const buscaCliente = document.getElementById('buscaCliente');
        const clienteId = document.getElementById('clienteId');
        const resultadosCliente = document.getElementById('resultadosCliente');

        const clienteEscolhido = document.getElementById('clienteEscolhido');
        const nomeClienteEscolhido = document.getElementById('nomeClienteEscolhido');

        // esconde o campo e mostra so o nome com o X
        function escolherCliente(cliente) {
            clienteId.value = cliente.id;
            nomeClienteEscolhido.textContent = cliente.nome;
            resultadosCliente.innerHTML = '';
            buscaCliente.style.display = 'none';
            clienteEscolhido.style.display = 'flex';
        }

        // clicou no X, apaga e volta o campo de busca
        document.getElementById('trocarCliente').addEventListener('click', function () {
            clienteId.value = '';
            buscaCliente.value = '';
            clienteEscolhido.style.display = 'none';
            buscaCliente.style.display = '';
            buscaCliente.focus();
        });

        buscaCliente.addEventListener('input', async function () {
            resultadosCliente.innerHTML = '';
            if (this.value.length < 2) {
                return;
            }

            const resposta = await fetch('/api/clientes/busca?nome=' + encodeURIComponent(this.value));
            const clientes = await resposta.json();

            if (clientes.length === 0) {
                resultadosCliente.innerHTML = '<div class="list-group-item text-muted">Nenhum cliente encontrado</div>';
                return;
            }

            for (const cliente of clientes) {
                const botao = document.createElement('button');
                botao.type = 'button';
                botao.className = 'list-group-item list-group-item-action d-flex justify-content-between';
                botao.innerHTML = '<span></span><span class="text-muted"></span>';
                botao.children[0].textContent = cliente.nome;
                botao.children[1].textContent = cliente.telefone || '';
                botao.addEventListener('click', function () {
                    escolherCliente(cliente);
                });
                resultadosCliente.appendChild(botao);
            }
        });

        // ===== busca de produto =====

        // busca enquanto digita, a partir de 2 letras
        buscaProduto.addEventListener('input', async function () {
            resultados.innerHTML = '';
            if (this.value.length < 2) {
                return;
            }

            const resposta = await fetch('/api/produtos/busca?nome=' + encodeURIComponent(this.value));
            const produtos = await resposta.json();

            if (produtos.length === 0) {
                resultados.innerHTML = '<div class="list-group-item text-muted">Nenhum produto encontrado</div>';
                return;
            }

            for (const produto of produtos) {
                const botao = document.createElement('button');
                botao.type = 'button';
                botao.className = 'list-group-item list-group-item-action d-flex justify-content-between';
                botao.innerHTML = '<span></span><span class="text-muted"></span>';
                botao.children[0].textContent = produto.nome;
                botao.children[1].textContent = formatarCentavos(produto.preco);
                botao.addEventListener('click', function () {
                    adicionarItem(produto);
                });
                resultados.appendChild(botao);
            }
        });

        function adicionarItem(produto) {
            resultados.innerHTML = '';
            buscaProduto.value = '';

            // se ja ta na lista so soma 1 na quantidade
            const linhaExistente = document.getElementById('item-' + produto.id);
            if (linhaExistente) {
                const campoQtd = linhaExistente.querySelector('input[name=quantidade]');
                campoQtd.value = Number(campoQtd.value) + 1;
                atualizarTotal();
                return;
            }

            const linha = document.createElement('tr');
            linha.id = 'item-' + produto.id;
            linha.dataset.preco = produto.preco;
            linha.innerHTML = `
                <td>
                    <span class="nome"></span>
                    <input type="hidden" name="produtoId">
                </td>
                <td class="preco"></td>
                <td><input type="number" name="quantidade" class="form-control form-control-sm" value="1" min="1" required></td>
                <td class="subtotal"></td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </td>
            `;
            // textContent pro nome n virar html
            linha.querySelector('.nome').textContent = produto.nome;
            linha.querySelector('input[name=produtoId]').value = produto.id;
            linha.querySelector('.preco').textContent = formatarCentavos(produto.preco);

            linha.querySelector('input[name=quantidade]').addEventListener('input', atualizarTotal);
            linha.querySelector('button').addEventListener('click', function () {
                linha.remove();
                atualizarTotal();
            });

            tabelaItens.appendChild(linha);
            atualizarTotal();
        }

        // recalcula subtotal de cada linha e o total, so pra mostrar
        function atualizarTotal() {
            let total = 0;
            const linhas = tabelaItens.querySelectorAll('tr[id^="item-"]');

            for (const linha of linhas) {
                const quantidade = Number(linha.querySelector('input[name=quantidade]').value);
                const subtotal = Number(linha.dataset.preco) * quantidade;
                linha.querySelector('.subtotal').textContent = formatarCentavos(subtotal);
                total = total + subtotal;
            }

            document.getElementById('total').textContent = formatarCentavos(total);

            if (linhas.length === 0) {
                semItens.style.display = '';
            } else {
                semItens.style.display = 'none';
            }
        }
    </script>

</div>

</body>
</html>
