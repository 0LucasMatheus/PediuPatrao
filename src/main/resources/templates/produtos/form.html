<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produto</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/produtos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">
            <span th:text="${produto.id != null} ? 'Editar Produto' : 'Novo Produto'"></span>
        </h2>
    </div>

    <div class="card shadow-sm" style="max-width: 540px;">
        <div class="card-body p-4">

            <form th:action="${produto.id != null}
                        ? @{/produtos/editar/{id}(id=${produto.id})}
                        : @{/produtos/salvar}"
                  th:object="${produto}"
                  method="post">

                <div class="mb-3">
                    <label for="nome" class="form-label fw-medium">Nome</label>
                    <input type="text" id="nome" class="form-control" th:field="*{nome}"
                           placeholder="Ex: Pizza Calabresa" required/>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label fw-medium">Tipo</label>
                    <select id="tipo" class="form-select" th:field="*{tipo}" required>
                        <option value="" disabled>Selecione o tipo</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Esfiha">Esfiha</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="precoTela" class="form-label fw-medium">Preço</label>
                    <!-- oq vai pro servidor e o hidden em centavos -->
                    <input type="text" id="precoTela" class="form-control" placeholder="R$ 0,00"
                           inputmode="numeric" required/>
                    <input type="hidden" id="preco" th:field="*{preco}"/>
                </div>

                <!-- desmarcado manda false -->
                <div class="form-check mb-4">
                    <input type="checkbox" id="ativo" class="form-check-input" th:field="*{ativo}"/>
                    <label for="ativo" class="form-check-label">Produto ativo</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="${produto.id != null} ? 'Salvar Alterações' : 'Criar Produto'"></span>
                    </button>
                    <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

    <script>
        const precoTela = document.getElementById('precoTela');
        const preco = document.getElementById('preco');

        // 4990 vira R$ 49,90
        function formatarCentavos(centavos) {
            const reais = (centavos / 100).toFixed(2).replace('.', ',');
            return 'R$ ' + reais;
        }

        // mascara de preco, so pega os numeros digitados
        precoTela.addEventListener('input', function () {
            const numeros = this.value.replace(/\D/g, '');
            preco.value = numeros;
            this.value = numeros ? formatarCentavos(numeros) : '';
        });

        // quando ta editando ja mostra o preco que tava salvo
        if (preco.value) {
            precoTela.value = formatarCentavos(preco.value);
        }
    </script>

</div>

</body>
</html>
