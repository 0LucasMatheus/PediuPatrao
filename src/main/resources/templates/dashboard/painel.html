<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <img th:src="@{/images/logo.png}" alt="Logo" width="60" height="64" class="rounded me-3">
            <h2 class="fw-bold mb-0">
                <i class="bi bi-graph-up me-2 text-primary"></i>Dashboard
            </h2>
        </div>
        <small class="text-muted" id="ultimaAtualizacao"></small>
    </div>

    <form id="filtros" class="card card-body shadow-sm mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small">De</label>
                <input type="date" id="inicio" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <label class="form-label small">Até</label>
                <input type="date" id="fim" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-arrow-clockwise me-1"></i> Atualizar
                </button>
            </div>
        </div>
    </form>

    <div class="alert alert-danger d-none" id="erro"></div>

    <div class="row g-3 mb-3">
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small"><i class="bi bi-cash-coin me-1"></i>Faturamento</div>
                    <div class="fs-3 fw-bold text-success" id="faturamento">-</div>
                    <div class="small" id="variacao"></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small"><i class="bi bi-bag me-1"></i>Pedidos</div>
                    <div class="fs-3 fw-bold" id="totalPedidos">-</div>
                    <div class="small text-muted">
                        <span id="finalizados">-</span> finalizados,
                        <span id="emAndamento">-</span> em andamento
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small"><i class="bi bi-receipt me-1"></i>Ticket médio</div>
                    <div class="fs-3 fw-bold" id="ticketMedio">-</div>
                    <div class="small text-muted">descontos: <span id="descontos">-</span></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small"><i class="bi bi-x-circle me-1"></i>Cancelados</div>
                    <div class="fs-3 fw-bold text-danger" id="cancelados">-</div>
                    <div class="small text-muted"><span id="taxaCancelamento">-</span>% dos pedidos</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-lg-8">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="fw-bold">Faturamento por dia</h6>
                    <div style="height: 280px">
                        <canvas id="graficoVendas"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="fw-bold">Pedidos por horário</h6>
                    <div style="height: 280px">
                        <canvas id="graficoHoras"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
        const inicio = document.getElementById('inicio');
        const fim = document.getElementById('fim');
        const erro = document.getElementById('erro');

        const AZUL = '#2a78d6';
        const CINZA_GRADE = '#e9e8e4';

        let graficoVendas = null;
        let graficoHoras = null;

        // centavos pra R$
        function dinheiro(centavos) {
            return (centavos / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function mostrarErro(mensagem) {
            erro.textContent = mensagem;
            erro.classList.remove('d-none');
        }

        // monta a url da api com as datas do filtro
        function urlComPeriodo(caminho) {
            return caminho + '?inicio=' + inicio.value + '&fim=' + fim.value;
        }

        function diaMes(data) {
            const partes = data.split('-');
            return partes[2] + '/' + partes[1];
        }

        // quanto o faturamento subiu ou caiu em relacao ao periodo anterior
        function mostrarVariacao(atual, anterior) {
            const variacao = document.getElementById('variacao');
            if (anterior === 0) {
                variacao.className = 'small text-muted';
                variacao.textContent = 'sem vendas no período anterior';
                return;
            }
            const porcentagem = (atual - anterior) / anterior * 100;
            if (porcentagem >= 0) {
                variacao.className = 'small text-success';
                variacao.textContent = '▲ ' + porcentagem.toFixed(1) + '% vs período anterior';
            } else {
                variacao.className = 'small text-danger';
                variacao.textContent = '▼ ' + Math.abs(porcentagem).toFixed(1) + '% vs período anterior';
            }
        }

        async function carregarResumo() {
            erro.classList.add('d-none');

            let url = '/api/dashboard/resumo';
            // na primeira vez vai sem data e a api usa os ultimos 30 dias
            if (inicio.value && fim.value) {
                url += '?inicio=' + inicio.value + '&fim=' + fim.value;
            }

            try {
                const resposta = await fetch(url);
                const dados = await resposta.json();

                // a api manda o motivo no campo erro, tipo data invalida
                if (!resposta.ok) {
                    mostrarErro(dados.erro || 'Não foi possível carregar o dashboard.');
                    return false;
                }

                // preenche as datas com o periodo que a api usou
                inicio.value = dados.inicio;
                fim.value = dados.fim;

                document.getElementById('faturamento').textContent = dinheiro(dados.faturamento);
                mostrarVariacao(dados.faturamento, dados.faturamentoAnterior);

                document.getElementById('totalPedidos').textContent = dados.totalPedidos;
                document.getElementById('finalizados').textContent = dados.finalizados;
                document.getElementById('emAndamento').textContent = dados.emAndamento;

                document.getElementById('ticketMedio').textContent = dinheiro(dados.ticketMedio);
                document.getElementById('descontos').textContent = dinheiro(dados.descontos);

                document.getElementById('cancelados').textContent = dados.cancelados;
                document.getElementById('taxaCancelamento').textContent = dados.taxaCancelamento;

                return true;
            } catch (e) {
                mostrarErro('Não foi possível falar com o servidor.');
                return false;
            }
        }

        async function carregarVendas() {
            const resposta = await fetch(urlComPeriodo('/api/dashboard/vendas'));
            if (!resposta.ok) {
                mostrarErro('Não foi possível carregar o gráfico de vendas.');
                return;
            }
            const vendas = await resposta.json();

            // o chart.js quer uma lista de nomes e uma de valores
            const dias = [];
            const valores = [];
            for (const venda of vendas) {
                dias.push(diaMes(venda.periodo));
                valores.push(venda.faturamento);
            }

            if (graficoVendas) {
                graficoVendas.destroy();
            }
            graficoVendas = new Chart(document.getElementById('graficoVendas'), {
                type: 'line',
                data: {
                    labels: dias,
                    datasets: [{
                        label: 'Faturamento',
                        data: valores,
                        borderColor: AZUL,
                        backgroundColor: AZUL,
                        borderWidth: 2,
                        pointRadius: 3,
                        pointHoverRadius: 5,
                        tension: 0.2
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    // tooltip aparece so de passar o mouse perto do dia
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function (item) {
                                    return 'Faturamento: ' + dinheiro(item.raw);
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            beginAtZero: true,
                            grid: { color: CINZA_GRADE },
                            ticks: {
                                callback: function (valor) {
                                    return dinheiro(valor);
                                }
                            }
                        }
                    }
                }
            });
        }

        async function carregarPorHora() {
            const resposta = await fetch(urlComPeriodo('/api/dashboard/vendas-por-hora'));
            if (!resposta.ok) {
                mostrarErro('Não foi possível carregar o gráfico por horário.');
                return;
            }
            const horas = await resposta.json();

            const nomes = [];
            const pedidos = [];
            for (const hora of horas) {
                nomes.push(hora.hora + 'h');
                pedidos.push(hora.pedidos);
            }

            if (graficoHoras) {
                graficoHoras.destroy();
            }
            graficoHoras = new Chart(document.getElementById('graficoHoras'), {
                type: 'bar',
                data: {
                    labels: nomes,
                    datasets: [{
                        label: 'Pedidos',
                        data: pedidos,
                        backgroundColor: AZUL,
                        maxBarThickness: 24,
                        // arredonda so a ponta de cima da barra
                        borderRadius: { topLeft: 4, topRight: 4 },
                        borderSkipped: 'bottom'
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            beginAtZero: true,
                            grid: { color: CINZA_GRADE },
                            // n tem meio pedido
                            ticks: { precision: 0 }
                        }
                    }
                }
            });
        }

        // resumo primeiro pq ele preenche as datas, depois os graficos usam elas
        async function atualizar() {
            erro.classList.add('d-none');
            const deuCerto = await carregarResumo();
            if (!deuCerto) {
                return;
            }
            await carregarVendas();
            await carregarPorHora();

            document.getElementById('ultimaAtualizacao').textContent =
                'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
        }

        document.getElementById('filtros').addEventListener('submit', function (evento) {
            // n recarrega a pagina, so busca os dados de novo
            evento.preventDefault();
            atualizar();
        });

        atualizar();
    </script>
</div>

</body>
</html>
