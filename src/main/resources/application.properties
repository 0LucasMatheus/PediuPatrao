# puxa as variaveis do .env
spring.config.import=optional:file:.env[.properties]

# mongo
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao}

# usuarios criados na primeira vez que sobe
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.gerente.username=${GERENTE_USERNAME:gerente}
app.gerente.password=${GERENTE_PASSWORD}
app.atendente.username=${ATENDENTE_USERNAME:atendente}
app.atendente.password=${ATENDENTE_PASSWORD}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.umc.pediupatrao=DEBUG
