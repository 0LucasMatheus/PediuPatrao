<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <a th:href="@{/produtos/novo}" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </a>
    </div>

    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <form id="filtros" th:action="@{/produtos}" method="get" class="card card-body shadow-sm mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small">Nome</label>
                <input type="text" name="nome" class="form-control form-control-sm"
                       th:value="${nome}" placeholder="Ex: calabresa">
            </div>
            <div class="col-md-2">
                <label class="form-label small">Tipo</label>
                <select name="tipo" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option value="Pizza" th:selected="${tipo == 'Pizza'}">Pizza</option>
                    <option value="Esfiha" th:selected="${tipo == 'Esfiha'}">Esfiha</option>
                    <option value="Lanche" th:selected="${tipo == 'Lanche'}">Lanche</option>
                    <option value="Bebida" th:selected="${tipo == 'Bebida'}">Bebida</option>
                    <option value="Porção" th:selected="${tipo == 'Porção'}">Porção</option>
                    <option value="Adicional" th:selected="${tipo == 'Adicional'}">Adicional</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small">Ativo</label>
                <select name="ativo" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option value="sim" th:selected="${ativo == 'sim'}">Sim</option>
                    <option value="nao" th:selected="${ativo == 'nao'}">Não</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">Ordenar por</label>
                <select name="ordem" class="form-select form-select-sm">
                    <option value="nome" th:selected="${ordem == 'nome'}">Nome A-Z</option>
                    <option value="nome_desc" th:selected="${ordem == 'nome_desc'}">Nome Z-A</option>
                    <option value="menor_preco" th:selected="${ordem == 'menor_preco'}">Menor preço</option>
                    <option value="maior_preco" th:selected="${ordem == 'maior_preco'}">Maior preço</option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-1">
                <button type="submit" class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-search"></i> Filtrar
                </button>
                <a th:href="@{/produtos}" class="btn btn-sm btn-outline-secondary" title="Limpar">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${produtos.empty}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum produto encontrado.
                        </td>
                    </tr>
                    <tr th:each="produto : ${produtos.content}">
                        <td class="ps-4 fw-medium" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <!-- preco ta em centavos, divide por 100 pra mostrar -->
                        <td th:text="${produto.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(produto.preco / 100.0, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
                        <td>
                            <!-- ativo pode vir null -->
                            <span class="badge"
                                  th:classappend="${produto.ativo == true} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${produto.ativo == true} ? 'Sim' : 'Não'"></span>
                        </td>
                        <td class="text-end pe-4">
                            <th:block sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                                <a th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil-fill"></i> Editar
                                </a>
                                <form th:action="@{/produtos/excluir/{id}(id=${produto.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Tem certeza que deseja excluir este produto?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash-fill"></i> Excluir
                                    </button>
                                </form>
                            </th:block>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <div class="small text-muted mb-2">
                Total: <strong th:text="${produtos.totalElements}"></strong> produto(s)
            </div>
            <div th:replace="~{fragments/paginacao :: paginacao(${produtos})}"></div>
        </div>
    </div>

</div>

</body>
</html>
