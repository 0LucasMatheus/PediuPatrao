<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- paginacao das listas, recebe o Page do spring -->
<!-- os botoes mandam o form de id "filtros" da tela, ai os filtros continuam -->
<div th:fragment="paginacao(pagina)" class="d-flex justify-content-between align-items-center"
     th:if="${pagina.totalPages > 1}">

    <button type="submit" form="filtros" name="pagina" th:value="${pagina.number - 1}"
            class="btn btn-sm btn-outline-secondary" th:disabled="${pagina.first}">
        <i class="bi bi-chevron-left"></i> Anterior
    </button>

    <span class="small text-muted">
        Página <strong th:text="${pagina.number + 1}"></strong>
        de <strong th:text="${pagina.totalPages}"></strong>
    </span>

    <button type="submit" form="filtros" name="pagina" th:value="${pagina.number + 1}"
            class="btn btn-sm btn-outline-secondary" th:disabled="${pagina.last}">
        Próxima <i class="bi bi-chevron-right"></i>
    </button>
</div>

</body>
</html>
