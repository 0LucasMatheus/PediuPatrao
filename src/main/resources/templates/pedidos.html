<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
    </div>

    <!-- Mensagens de feedback -->
    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Entrada</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4">
                            <div th:text="${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')}"></div>
                            <small class="text-muted" th:text="${pedido.responsavelEntrada}"></small>
                        </td>
                        <td th:text="${pedido.clienteNome}"></td>
                        <td class="small">
                            <div th:each="item : ${pedido.itens}"
                                 th:text="${item.quantidade} + 'x ' + ${item.nomeProduto}"></div>
                        </td>
                        <!-- total ta em centavos -->
                        <td class="fw-medium"
                            th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal / 100.0, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${pedido.status}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
