<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Pedido</h2>
        <!-- cor de cada status -->
        <span class="badge fs-6"
              th:classappend="${pedido.status?.name() == 'CANCELADO'} ? 'bg-danger' :
                              (${pedido.status?.name() == 'FINALIZADO'} ? 'bg-success' :
                              (${pedido.status?.name() == 'RECEBIDO'} ? 'bg-secondary' : 'bg-warning text-dark'))"
              th:text="${#strings.replace(pedido.status?.name(), '_', ' ')}"></span>
    </div>

    <div th:replace="~{fragments/alertas :: alertas}"></div>

    <div class="row g-3" style="max-width: 1000px;">

        <!-- dados do pedido -->
        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <p class="mb-2"><strong>Cliente:</strong> <span th:text="${pedido.clienteNome}"></span></p>

                    <!-- dados do cliente, so aparece se ele ainda existe -->
                    <th:block th:if="${cliente != null}">
                        <p class="mb-2">
                            <strong>Telefone:</strong> <span th:text="${cliente.telefone} ?: '—'"></span>
                        </p>
                        <p class="mb-2">
                            <strong>Endereço:</strong>
                            <span th:text="${cliente.logradouro}"></span>,
                            <span th:text="${cliente.numero}"></span>
                            <span th:if="${cliente.complemento != null and !cliente.complemento.isBlank()}"
                                  th:text="' - ' + ${cliente.complemento}"></span>
                            <br>
                            <span th:text="${cliente.bairro}"></span> -
                            <span th:text="${cliente.cidade}"></span>/<span th:text="${cliente.estado}"></span>
                            <br>
                            <span class="text-muted">CEP</span> <span th:text="${cliente.cep}"></span>
                        </p>
                    </th:block>
                    <p class="mb-2 text-muted small" th:if="${cliente == null}">Cliente não está mais cadastrado.</p>

                    <hr>

                    <p class="mb-2">
                        <strong>Entrada:</strong>
                        <span th:text="${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')}"></span>
                        por <span th:text="${pedido.responsavelEntrada}"></span>
                    </p>

                    <p class="mb-2" th:if="${pedido.dataHoraSaida != null}">
                        <strong>Saída:</strong>
                        <span th:text="${#temporals.format(pedido.dataHoraSaida, 'dd/MM/yyyy HH:mm')}"></span>
                        por <span th:text="${pedido.responsavelSaida}"></span>
                    </p>

                    <!-- cancelado mostra quem, quando e por que -->
                    <div class="alert alert-danger mb-0 mt-3" th:if="${pedido.dataHoraCancelamento != null}">
                        <strong>Cancelado</strong>
                        em <span th:text="${#temporals.format(pedido.dataHoraCancelamento, 'dd/MM/yyyy HH:mm')}"></span>
                        por <span th:text="${pedido.responsavelCancelamento}"></span>
                        <div class="mt-1">
                            <strong>Justificativa:</strong>
                            <span th:text="${pedido.justificativaCancelamento}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- itens e valores, tudo em centavos -->
        <div class="col-md-7">
            <div class="card shadow-sm h-100">
                <div class="card-body p-0">
                    <table class="table mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">Produto</th>
                                <th>Preço</th>
                                <th>Qtd</th>
                                <th class="text-end pe-3">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${pedido.itens}">
                                <td class="ps-3" th:text="${item.nomeProduto}"></td>
                                <td th:text="'R$ ' + ${#numbers.formatDecimal(item.precoUnitario / 100.0, 1, 'POINT', 2, 'COMMA')}"></td>
                                <td th:text="${item.quantidade}"></td>
                                <td class="text-end pe-3" th:text="'R$ ' + ${#numbers.formatDecimal(item.subtotal / 100.0, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" class="text-end">Subtotal</td>
                                <td class="text-end pe-3" th:text="'R$ ' + ${#numbers.formatDecimal(pedido.subtotal / 100.0, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                            <tr th:if="${pedido.descontoPercentual > 0}" class="text-success">
                                <td colspan="3" class="text-end">
                                    Desconto (<span th:text="${pedido.descontoPercentual}"></span>%)
                                </td>
                                <td class="text-end pe-3" th:text="'- R$ ' + ${#numbers.formatDecimal(pedido.valorDesconto / 100.0, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                            <tr class="fw-bold">
                                <td colspan="3" class="text-end">Total</td>
                                <td class="text-end pe-3" th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal / 100.0, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <!-- acoes do gerente, so antes da saida. a trava de verdade ta no backend -->
        <th:block sec:authorize="hasRole('GERENTE')" th:if="${pedido.status.antesDaSaida()}">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6 class="fw-bold"><i class="bi bi-percent me-1"></i>Aplicar desconto</h6>
                        <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post" class="d-flex gap-2">
                            <div class="input-group">
                                <input type="number" name="percentual" class="form-control"
                                       min="1" max="20" required placeholder="1 a 20"
                                       th:value="${pedido.descontoPercentual > 0} ? ${pedido.descontoPercentual} : ''">
                                <span class="input-group-text">%</span>
                            </div>
                            <button type="submit" class="btn btn-success">Aplicar</button>
                        </form>
                        <small class="text-muted">Aplicar de novo troca o desconto, não soma.</small>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm border-danger">
                    <div class="card-body">
                        <h6 class="fw-bold text-danger"><i class="bi bi-x-octagon me-1"></i>Cancelar pedido</h6>
                        <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post"
                              onsubmit="return confirm('Cancelar esse pedido? Depois não dá pra desfazer.')">
                            <textarea name="justificativa" class="form-control mb-2" rows="2" required
                                      placeholder="Por que o pedido está sendo cancelado?"></textarea>
                            <button type="submit" class="btn btn-danger">Cancelar pedido</button>
                        </form>
                    </div>
                </div>
            </div>
        </th:block>

    </div>

</div>

</body>
</html>
