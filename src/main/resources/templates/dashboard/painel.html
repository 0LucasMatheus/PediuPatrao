<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <img th:src="@{/images/logo.png}" alt="Logo" width="60" height="64" class="rounded me-3">
            <h2 class="fw-bold mb-0">
                <i class="bi bi-graph-up me-2 text-primary"></i>Dashboard
            </h2>
        </div>
        <small class="text-muted" id="ultimaAtualizacao"></small>
    </div>

    <form id="filtros" class="card card-body shadow-sm mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small">De</label>
                <input type="date" id="inicio" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <label class="form-label small">Até</label>
                <input type="date" id="fim" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-arrow-clockwise me-1"></i> Atualizar
                </button>
            </div>
        </div>
    </form>

    <div class="alert alert-danger d-none" id="erro"></div>

    <div class="row g-3 mb-3">
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small"><i class="bi bi-cash-coin me-1"></i>Faturamento</div>
                    <div class="fs-3 fw-bold text-success" id="faturamento">-</div>
                    <div class="small" id="variacao"></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small"><i class="bi bi-bag me-1"></i>Pedidos</div>
                    <div class="fs-3 fw-bold" id="totalPedidos">-</div>
                    <div class="small text-muted">
                        <span id="finalizados">-</span> finalizados,
                        <span id="emAndamento">-</span> em andamento
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small"><i class="bi bi-receipt me-1"></i>Ticket médio</div>
                    <div class="fs-3 fw-bold" id="ticketMedio">-</div>
                    <div class="small text-muted">descontos: <span id="descontos">-</span></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small"><i class="bi bi-x-circle me-1"></i>Cancelados</div>
                    <div class="fs-3 fw-bold text-danger" id="cancelados">-</div>
                    <div class="small text-muted"><span id="taxaCancelamento">-</span>% dos pedidos</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inicio = document.getElementById('inicio');
        const fim = document.getElementById('fim');
        const erro = document.getElementById('erro');

        // centavos pra R$
        function dinheiro(centavos) {
            return (centavos / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // quanto o faturamento subiu ou caiu em relacao ao periodo anterior
        function mostrarVariacao(atual, anterior) {
            const variacao = document.getElementById('variacao');
            if (anterior === 0) {
                variacao.className = 'small text-muted';
                variacao.textContent = 'sem vendas no período anterior';
                return;
            }
            const porcentagem = (atual - anterior) / anterior * 100;
            if (porcentagem >= 0) {
                variacao.className = 'small text-success';
                variacao.textContent = '▲ ' + porcentagem.toFixed(1) + '% vs período anterior';
            } else {
                variacao.className = 'small text-danger';
                variacao.textContent = '▼ ' + Math.abs(porcentagem).toFixed(1) + '% vs período anterior';
            }
        }

        async function carregarResumo() {
            erro.classList.add('d-none');

            let url = '/api/dashboard/resumo';
            // na primeira vez vai sem data e a api usa os ultimos 30 dias
            if (inicio.value && fim.value) {
                url += '?inicio=' + inicio.value + '&fim=' + fim.value;
            }

            try {
                const resposta = await fetch(url);
                const dados = await resposta.json();

                // a api manda o motivo no campo erro, tipo data invalida
                if (!resposta.ok) {
                    erro.textContent = dados.erro || 'Não foi possível carregar o dashboard.';
                    erro.classList.remove('d-none');
                    return;
                }

                // preenche as datas com o periodo que a api usou
                inicio.value = dados.inicio;
                fim.value = dados.fim;

                document.getElementById('faturamento').textContent = dinheiro(dados.faturamento);
                mostrarVariacao(dados.faturamento, dados.faturamentoAnterior);

                document.getElementById('totalPedidos').textContent = dados.totalPedidos;
                document.getElementById('finalizados').textContent = dados.finalizados;
                document.getElementById('emAndamento').textContent = dados.emAndamento;

                document.getElementById('ticketMedio').textContent = dinheiro(dados.ticketMedio);
                document.getElementById('descontos').textContent = dinheiro(dados.descontos);

                document.getElementById('cancelados').textContent = dados.cancelados;
                document.getElementById('taxaCancelamento').textContent = dados.taxaCancelamento;

                document.getElementById('ultimaAtualizacao').textContent =
                    'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
            } catch (e) {
                erro.textContent = 'Não foi possível falar com o servidor.';
                erro.classList.remove('d-none');
            }
        }

        document.getElementById('filtros').addEventListener('submit', function (evento) {
            // n recarrega a pagina, so busca os dados de novo
            evento.preventDefault();
            carregarResumo();
        });

        carregarResumo();
    </script>
</div>

</body>
</html>
